# ── พจนานุกรมคำพูด → tag ────────────────────────────────────────────────
# ซ้ายมือ = ชื่อ tag ที่ใช้ตั้งชื่อโฟลเดอร์  |  ขวามือ = คำที่เราอาจพูดออกมา
# เพิ่มคำได้เรื่อยๆ ตามที่ Whisper ถอดเพี้ยน (ดูข้อความที่ถอดได้บนหัวหน้าต่าง)
# หมายเหตุ: คำไทยสั้นกว่า 3 ตัวอักษร จะจับเฉพาะเมื่ออยู่ท้ายคำ (กัน "เอ" ใน "เอาไว้")
# สำคัญ: alias ของหมวดหนึ่ง "ห้ามมีคำของอีกหมวดฝังอยู่" เช่นห้ามใส่ "บุกบี" ในหมวด
#        places เพราะเวลาพูดติดกันมันจะกลืนคำว่า "บุก" ในหมวด sides จนฝั่งหายไป

