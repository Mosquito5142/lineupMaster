# คำที่บอกว่าเป็น "จุดยืน" (นำหน้าสถานที่) — ช่วยแยก from ออกจาก to
from_markers: [จาก, ยืนที่, ยืน, ตรง, ที่, from]
to_markers:   [ไป, ลง, ใส่, เข้า, ยิงไป, to, into, onto]
