# ── LineupMaster config ────────────────────────────────────────────────
# แก้ไฟล์นี้แล้วรันใหม่ (ไม่ต้องแก้โค้ด)

lineups_dir: lineups        # โฟลเดอร์เก็บรูปไลน์อัพ (relative กับที่ตั้งไฟล์นี้)

# ── ปุ่มควบคุม ─────────────────────────────────────────────────────────
# ต้องเปิด NumLock ไว้ ไม่งั้น Windows จะส่ง Numpad เป็นปุ่มลูกศร/End/PgDn แทน
# VALORANT ไม่ได้ผูก Numpad ไว้เลย จึงไม่ชนกับปุ่มในเกม
# (โปรแกรมแยก Numpad ออกจากแป้นเลขแถวบนได้ กดเปลี่ยนอาวุธ 1-4 จึงไม่โดนสั่ง)
hotkeys:
  next_map: "numpad+"       # เปลี่ยนแมพ (วนเฉพาะแมพที่มีรูป)
  prev_map: "numpad-"
  toggle_side: "numpad0"    # สลับ บุก ↔ ตั้งรับ
  site_a: "numpad1"         # ดูเฉพาะจุด A  (กดซ้ำ = กลับไปดูทั้งครึ่ง)
  site_b: "numpad2"
  site_c: "numpad3"
  prev_image: "numpad4"     # เลื่อนกรอบเลือกรูป
  zoom: "numpad5"           # ซูมรูปที่เลือกเต็มจอ (กดซ้ำ = ออก)
  next_image: "numpad6"
  show_all: "numpad."       # กลับไปดูทั้งครึ่ง
  toggle_gif: "numpad*"     # เล่น/หยุด gif ของรูปที่ซูมอยู่ (ต้องซูมก่อน)
  toggle_map: "numpad/"     # เข้า/ออกหน้าแผนที่ (เลือกจาก "จุดที่เรายืน")
  pin_7: "numpad7"          # บนแผนที่: เลข 1-9 = เลือกหมุดนั้น (7/8/9 ต้องผูกไว้ hook ถึงจะเห็น)
  pin_8: "numpad8"
  pin_9: "numpad9"

display:
  monitor: 1                # จอที่จะให้หน้าต่างไปโผล่ (1 = LG ULTRAWIDE, 2 = AOC)
  fullscreen: false         # false = หน้าต่างไร้ขอบ ลากย้ายจอได้ (fullscreen จริงย้ายไม่ได้)
  always_on_top: true
  max_images: 0             # 0 = โชว์ทุกรูปในกลุ่ม / ใส่ตัวเลขถ้าอยากจำกัด
  show_status: true         # ข้อความแจ้งชั่วคราว เช่น "ไม่มีรูปของกลุ่มนี้"
  show_labels: true         # โชว์ชื่อไฟล์ทับมุมล่างซ้ายของแต่ละรูป
  equal_size: true          # ทุกรูปขนาดเท่ากัน (ตาราง) / false = รูปแรกใหญ่กว่า

gif:
  max_seconds: 3.0          # gif ที่ยาวกว่านี้ --list จะเตือน (ไม่ตัดให้ ต้องไปตัดเอง)
