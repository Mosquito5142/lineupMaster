# ── LineupMaster config ────────────────────────────────────────────────
# แก้ไฟล์นี้แล้วรันใหม่ (ไม่ต้องแก้โค้ด)
# ค่าส่วนใหญ่ (โหมดตามตัว, เกณฑ์เทียบชื่อโซน, หน้าแผนที่, หน้าต่าง) ปรับได้ที่แท็บ "ตั้งค่า" ในหน้า
# จัดการคลังแบบเว็บ — ที่ปรับตรงนั้นเก็บใน settings.json และ **ทับค่าในไฟล์นี้** (ถ้าแก้ที่นี่แล้วไม่มีผล
# ให้ดูว่าช่องนั้นในหน้าตั้งค่าถูกปรับไว้หรือเปล่า — กด ↺ เพื่อกลับมาใช้ค่าในไฟล์นี้)

lineups_dir: lineups        # โฟลเดอร์เก็บรูปไลน์อัพ (relative กับที่ตั้งไฟล์นี้)

# ── ปุ่มควบคุม ─────────────────────────────────────────────────────────
# ต้องเปิด NumLock ไว้ ไม่งั้น Windows จะส่ง Numpad เป็นปุ่มลูกศร/End/PgDn แทน
# VALORANT ไม่ได้ผูก Numpad ไว้เลย จึงไม่ชนกับปุ่มในเกม
# (โปรแกรมแยก Numpad ออกจากแป้นเลขแถวบนได้ กดเปลี่ยนอาวุธ 1-4 จึงไม่โดนสั่ง)
hotkeys:
  next_map: "numpad+"       # เปลี่ยนแมพ (วนเฉพาะแมพที่มีรูป)
  prev_map: "numpad-"
  toggle_side: "numpad0"    # สลับ บุก ↔ ตั้งรับ
  site_a: "numpad1"         # ดูเฉพาะจุด A  (กดซ้ำ = กลับไปดูทั้งครึ่ง)
  site_b: "numpad2"
  site_c: "numpad3"
  prev_image: "numpad4"     # เลื่อนกรอบเลือกรูป
  zoom: "numpad5"           # ซูมรูปที่เลือกเต็มจอ (กดซ้ำ = ออก)
  next_image: "numpad6"
  show_all: "numpad."       # กลับไปดูทั้งครึ่ง
  toggle_gif: "numpad*"     # เล่น/หยุด gif ของรูปที่ซูมอยู่ (ต้องซูมก่อน)
  toggle_map: "numpad/"     # เข้า/ออกหน้าแผนที่ (เลือกจาก "จุดที่เรายืน")
  pin_7: "numpad7"          # บนแผนที่: เลข 1-9 = เลือกหมุดนั้น (7/8/9 ต้องผูกไว้ hook ถึงจะเห็น)
  pin_8: "numpad8"
  pin_9: "numpad9"
  locate: "insert"          # แคปชื่อโซนจากจอเกมเอง อ่านด้วย OCR แล้วชี้หมุดที่ใกล้ที่สุด
                            # (กดปุ่มเดียวจบ ไม่ต้อง Win+Shift+S — ถ้าแคปจอไม่ติดจะใช้รูปใน
                            # คลิปบอร์ดแทนให้เอง · ปรับกรอบที่แคปได้ที่ "เลือกกรอบแคปชื่อโซน")
                            # อยู่นอก numpad เพราะ numpad เต็มแล้ว — บนหน้าแผนที่ เลข 1-9
                            # ถูกใช้เลือกหมุดหมด ไม่เหลือปุ่มที่ใช้ได้ทั้งสองโหมด

  auto_locate: "f9"         # เปิด/ปิด "โหมดตามตัว" — อ่านชื่อโซนจากจอเกมเองเรื่อยๆ แทนการกด
                            # Insert ทีละครั้ง เดินไปโซนไหนหน้าแผนที่ก็ตามไป **วงพื้นที่** ตรงนั้นให้
                            # (วงประแดง + ชื่อโซน) — **วงเฉยๆ ไม่เลือกหมุดให้** เลข 1-9 จึงยังแปลว่า
                            # "หมุด" ตลอด กดตัวที่จะใช้ได้เลย ไม่ต้องกด numpad . ถอยออกก่อน
                            # **หยุดขยับจอทันทีที่เรากดเลือกหมุดเอง** (= เริ่มจะใช้ไลน์อัพแล้ว)
                            # แล้ว**เดินออกจากโซนนั้นเมื่อไหร่ก็ตามต่อเอง** ไม่ต้องกด numpad .
                            # ถอยออกมาก่อน และไม่ต้องกดเปิดใหม่ (ปิดได้ที่ auto.resume_on_move)
                            # ใช้ F9 เพราะ numpad กับบล็อก 6 ปุ่มเหนือลูกศรเต็มหมดแล้ว

  # ── ตัวกรอง — บล็อก 6 ปุ่มเหนือลูกศร (ติดกับ numpad มือเดียวกดถึง) ──
  # กรองแล้วมีผลทั้งกริด หมุดบนแผนที่ และปุ่มหาโซน (Insert) พร้อมกัน
  # หัวจอจะขึ้นเสมอว่ากำลังกรองอะไรอยู่ จะได้ไม่งงว่ารูปหายไปไหน
  filter_agent: "delete"    # สลับตัวละคร (ทั้งหมด → โซวา → ไซเฟอร์ → ...)
  filter_ability: "home"    # สลับสกิล (ทั้งหมด → รีคอน → ช็อก → ...)
  filter_fav: "end"         # เปิด/ปิด "เฉพาะไม้ตาย" (ติดดาวในหน้าจัดการคลัง)
  filter_tag: "page up"     # สลับแท็กสถานการณ์ (แก้ทางตัวไหน / post-plant)
  vote_works: "f7"          # ✓ ใช้ได้จริง ให้ใบที่เอามาจากคอมมูนิตี้ (กดซ้ำ = ถอน) — ส่งคะแนนตอนเปิดหน้าเว็บ
  flag: "f8"                # ⚑ แจ้งผิดใบที่เลือก/ซูมอยู่ (กดซ้ำ = เอาธงออก) — ไปแก้ในเว็บ แท็บคลัง → ⚑ ต้องแก้
  drill: "page down"        # โหมดซ้อม: สุ่มไลน์อัพจากที่กรองอยู่ แล้วซูมให้เลย

display:
  monitor: 1                # จอที่จะให้หน้าต่างไปโผล่ (1 = LG ULTRAWIDE, 2 = AOC)
  fullscreen: false         # false = หน้าต่างไร้ขอบ ลากย้ายจอได้ (fullscreen จริงย้ายไม่ได้)
  always_on_top: true
  max_images: 0             # 0 = โชว์ทุกรูปในกลุ่ม / ใส่ตัวเลขถ้าอยากจำกัด
  show_status: true         # ข้อความแจ้งชั่วคราว เช่น "ไม่มีรูปของกลุ่มนี้"
  show_labels: true         # โชว์ชื่อไฟล์ทับมุมล่างซ้ายของแต่ละรูป
  equal_size: true          # ทุกรูปขนาดเท่ากัน (ตาราง) / false = รูปแรกใหญ่กว่า
  start_on_map: true        # เปิดโปรแกรมมาที่หน้าแผนที่เลย (false = เปิดมาที่กริดรูปแบบเดิม)

gif:
  max_seconds: 3.0          # gif ที่ยาวกว่านี้ --list จะเตือน (ไม่ตัดให้ ต้องไปตัดเอง)

# ── โหมดตามตัว (กด F9) ────────────────────────────────────────────────────
# อ่านชื่อโซนจากมุมมินิแมพของจอเกมเป็นระยะ แล้วเลื่อนหน้าแผนที่ตามให้เอง
# **อ่านจอตัวเองอย่างเดียว** ไม่อ่านหน่วยความจำเกม ไม่ส่งปุ่มกลับเข้าเกม และไม่ซ้อนทับจอเกม
# (ใช้กรอบเดียวกับปุ่ม Insert — ปรับกรอบได้ที่ "เลือกกรอบแคปชื่อโซน")
auto:
  start_on: false           # เปิดโปรแกรมมาแล้วเริ่มตามตัวเลยไหม (false = รอกด F9)
  interval_ms: 1000         # อ่านจอทุกกี่มิลลิวินาที — วัดบนเครื่องนี้แล้วรอบหนึ่งกินแค่
                            # แคป ~5 ms (เธรดหลัก) + OCR ~17 ms (เธรดแยก) = ~2% ของซีพียู
                            # ที่ 1000 ms · กับ confirm: 2 แปลว่าตามทันภายในราว 2 วินาที
  confirm: 2                # ต้องอ่านได้ชื่อเดิมติดกันกี่ครั้งถึงจะเชื่อ (กัน OCR เพี้ยนครั้งเดียว)
  blank_limit: 5            # แคปได้ภาพว่างติดกันกี่ครั้งถึงจะปิดโหมดให้เอง (เกมเต็มจอแบบผูกขาด)
  resume_on_move: true      # กดเลือกหมุด/ซูมรูปค้างไว้แล้วเดินออกจากโซนนั้น = ตามต่อให้เอง
                            # (ยืนอยู่จุดเดิมนานแค่ไหนก็ไม่โดนขยับ เพราะโซนไม่เปลี่ยน — ที่หายไป
                            # คือการต้องกด numpad . ถอยออกมาเองทุกครั้งก่อนเดินต่อ)
                            # false = กลับไปแบบเดิม ต้องกด numpad . เองมันถึงจะตามต่อ
  resume_confirm: 3         # ...ต้องอ่านชื่อโซนใหม่ได้ติดกันกี่ครั้งถึงจะยอมเด้งออกจากรูปที่ซูมอยู่
                            # ขอมากกว่า confirm เพราะยืนคร่อมรอยต่อสองโซนแล้ว OCR สลับไปมา
                            # ตอนตามเฉยๆ แค่หมุดกระพริบ แต่ตอนนี้แปลว่าเด้งออกจากรูปกลางเล็ง
